# 投稿到 DSH 插件市场的条目（已定稿，复制粘贴即用）

**插件名**：`dsh-whale-song`
**中文名**：鲸歌 · 鲸鱼娘桌宠 —— DSH 里的 Live2D 鲸鱼娘（增强版）
**英文名**：Whale Song — the Live2D whale-girl companion for DeepSeek Harness
**发布者**：H-Canopy（<https://github.com/H-Canopy>）
**分类**：`fun`
**许可**：代码 MIT（原作者 **Andersen216**）／ 角色形象与模型素材 **CC BY-NC-SA 4.0（非商业）**

> **本仓库是什么**：上游 [`Andersen216/dsh-whale-girl-live2d`](https://github.com/Andersen216/dsh-whale-girl-live2d)（MIT）
> 的**增强版 fork** —— 除了桌宠本体，还接了本地音乐 / 在线电台 / 网易云联动，并做了独立桌面壳。
> 包名**故意**与上游不同（`dsh-whale-song` ≠ `dsh-whale-girl-live2d`）：
> 包名 / 安装源 / profile 键名都不同，**装一个、卸一个不会影响另一个**。
> ⚠️ 但两者插件 id（`dsh-live2d-pet`）与 `/dsh-pet/*` 路由前缀相同，
> **不建议同时启用**（同时开可能只有一个能正常工作；此条为推断，未经实测）。

> ⚠️ **署名不要删**：角色形象原作「溟月」© 上善无形、女仆鲸鱼娘二次设计 © ZipZipPipe、
> Live2D 模型（绑定/动作/表情）© 氵六青 —— 三位都是 **CC BY-NC-SA 4.0**，
> 署名 + 非商业 + 相同方式共享是硬要求。详见仓库 `LICENSE` 与 `AUTHORS.md`。

