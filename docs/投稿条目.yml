## 硬性要求（不满足会被打回）

1. 仓库里要有 `package.json` 声明 **`dsh.bundle`**（指向 `cordis.patch.yml`），
   并在同目录放 `cordis.patch.yml`。**只写 `dsh.client` 不算可安装**——最常见的被拒原因。
   ✅ 本项目已满足（`package.json` → `dsh.bundle.patch = ./cordis.patch.yml`）。
2. `url` 必须与仓库地址**完全一致**，且**文件名必须是 `owner__repo.yml`**（双下划线）。
3. `description.en` 必填；含「冒号 + 空格」时整行加引号（上面已经加好，用的是单引号）。
4. `category` 用列表里的取值，桌宠最贴切的是 `fun`。

---

## 关于 `package.json` 的 `author` 字段：**故意保留 Andersen216**

市场卡片的"发布者"取自 **仓库 owner**（也就是你 `H-Canopy`，由 `url` / `name` 决定），
**不是** npm 的 `author` 字段。所以：

| 字段 | 值 | 为什么 |
| --- | --- | --- |
| `author` | **Andersen216** | 上游基础代码是他的 MIT 作品。MIT 要求**保留版权署名**，抹掉它才是问题 |
| `contributors` | 上善无形 / ZipZipPipe / 氵六青 / **H-Canopy** | 角色与模型作者必须署名；你在最后一条里以"增强版 fork"身份出现 |
| `homepage` / `repository` / `bugs` | 全部指向 **H-Canopy/dsh-whale-song** | 用户点进去、报 issue 都落在你这边 |

（`tools/publish.mjs` 的自检也因此要求 `author` 里有 `Andersen216` —— 那不是笔误，是署名守门员。）

