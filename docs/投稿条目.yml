```yaml
url: https://github.com/H-Canopy/dsh-whale-song
name: H-Canopy/dsh-whale-song
category: fun
description:
  en: 'A Live2D whale-girl companion for the DeepSeek Harness Web UI: the model stays on screen and reacts to what the agent is actually doing (thinking, tool calls, streaming text, errors, turn completion); click her to send the agent a message and watch the reply stream into a speech bubble; right-click for a menu of expressions, dress-up items, desk scenes and one-shot animations, every action mapped from the original model author hotkey sheet so nothing overlaps and everything expires on its own. This fork (dsh-whale-song) additionally integrates local music, online radio and NetEase Cloud Music control, and ships a standalone desktop shell. Non-commercial model assets (CC BY-NC-SA 4.0, by the original character/model artists), MIT code by Andersen216; this enhanced fork is maintained by H-Canopy (https://github.com/H-Canopy).'
