# ============================================================================
# dsh-live2d-pet —— DSH bundle patch（本仓库 = dsh-whale-song，上游的增强版 fork）
# ============================================================================
# 插件挂载声明。DSH 启动时按 bundle 层栈叠加 patch，本文件把桌宠插件插入
# Web profile 的配置树。
#
# 安装（本仓库）：
#   dsh plugin --profile web add github:H-Canopy/dsh-whale-song
# 安装（本地开发，link 到源码目录）：
#   dsh plugin --profile web add "link:/绝对路径/dsh-whale-song"
# 卸载：
#   dsh plugin --profile web remove dsh-whale-song
#
# 上游（署名与同步来源）：
#   https://github.com/Andersen216/dsh-whale-girl-live2d
#
# ⚠️ 下面 insert 的 `name:` 必须与安装后的**包名**完全一致，否则 DSH 找不到模块，
#    表现为「装上了但桌宠不出现」。改包名时这里要一起改（上游踩过一次）。
#    本仓库已从上游的 dsh-whale-girl-live2d 改名为 dsh-whale-song，
#    所以**本包与上游包可以并存**（两者包名不同，不再互相替换）。
# ============================================================================

- insert:
    - id: dsh-live2d-pet
      name: dsh-whale-song
